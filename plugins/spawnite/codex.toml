# Codex CLI: the Spawnite server in ~/.codex/config.toml, from the published
# package. A checkout of game-platform runs it from its own
# .codex/config.toml instead.
[mcp_servers.spawnite]
command = "npx"
args = ["-y", "@spawnite/mcp@0.1.0-beta.17"]
# Codex stops a call after 60 s by default, and a model or a profile runs
# longer; a sweep past this goes through wait: false and read_run.
tool_timeout_sec = 600
